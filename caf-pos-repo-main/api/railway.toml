[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uv run uvicorn app.main:app --host 0.0.0.0 --port $PORT"
preDeployCommand = "uv run alembic upgrade head && uv run python scripts/seed.py && uv run python scripts/seed_customers.py && uv run python scripts/seed_sales.py"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
