<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F3EC" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1A140E" media="(prefers-color-scheme: dark)">
  <meta name="robots" content="noindex">
  <title>ออฟไลน์ · Kafé OS</title>
  <!-- Served by the service worker when the app shell is not cached and the
       network is down. Fully self-contained: no external CSS, fonts, images or
       scripts, so it renders with nothing but this file. Colours mirror the
       tokens in src/app/globals.css. -->
  <style>
    :root {
      color-scheme: light dark;
      --bg: #F7F3EC;
      --surface: #FFFFFF;
      --border: #E5E0D5;
      --text: #1A1A1A;
      --text-secondary: #5F6672;
      --primary: #3D2817;
      --primary-hover: #2A1A0F;
      --on-primary: #FFFFFF;
      --icon-bg: #FBF1DF;
      --icon-fg: #7A4E10;
      --focus: #8A5A14;
    }
    /* Dark palette: the theme saved in the app wins (data-theme, stamped by the
       script below); with no saved choice the OS setting decides. Keep the two
       blocks identical. */
    :root[data-theme='light'] { color-scheme: light; }
    :root[data-theme='dark'] {
      color-scheme: dark;
      --bg: #1A140E;
      --surface: #241B13;
      --border: #3A2E22;
      --text: #F5EFE7;
      --text-secondary: #B8AC9C;
      --primary: #E0C29A;
      --primary-hover: #F0DCC0;
      --on-primary: #1A140E;
      --icon-bg: #332817;
      --icon-fg: #E8B86A;
      --focus: #D4A574;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #1A140E;
        --surface: #241B13;
        --border: #3A2E22;
        --text: #F5EFE7;
        --text-secondary: #B8AC9C;
        --primary: #E0C29A;
        --primary-hover: #F0DCC0;
        --on-primary: #1A140E;
        --icon-bg: #332817;
        --icon-fg: #E8B86A;
        --focus: #D4A574;
      }
    }
    * { box-sizing: border-box; }
    html { height: 100%; }
    /* min-height, not height: when the card is taller than a short / zoomed
       viewport the body must grow with it, or the bottom padding (and safe-area
       inset) is lost and the card ends flush against the screen edge. */
    body { min-height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding:
        max(24px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      background: var(--bg);
      color: var(--text);
      font-family: "Anuphan", "Sukhumvit Set", "IBM Plex Sans Thai", "Noto Sans Thai", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 100%;
      max-width: 420px;
      padding: 32px 28px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      text-align: center;
    }
    .icon {
      width: 56px;
      height: 56px;
      margin: 0 auto 20px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: var(--icon-bg);
      color: var(--icon-fg);
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.25;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    /* No text-wrap: balance/pretty here — those line breakers split Thai mid-word. */
    p { margin: 0; color: var(--text-secondary); }
    .en {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      font-size: 14px;
    }
    .en strong { display: block; color: var(--text); font-weight: 600; }
    button {
      width: 100%;
      min-height: 48px;
      margin-top: 24px;
      padding: 12px 20px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: var(--on-primary);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: background 120ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    button:hover { background: var(--primary-hover); }
    button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
    button[disabled] { opacity: 0.7; cursor: progress; }
    #status { margin-top: 12px; font-size: 14px; }
    #status:empty { margin-top: 0; }
    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
  <script>
    // Same key and rule as the no-flash script in src/app/layout.tsx: the theme
    // picked in the app wins over the OS setting, so a shop running the POS in
    // dark mode does not get a bright page (or the reverse) when it drops offline.
    (function () {
      try {
        var theme = localStorage.getItem('kafe-theme');
        if (theme !== 'light' && theme !== 'dark') return;
        document.documentElement.setAttribute('data-theme', theme);
        var color = theme === 'dark' ? '#1A140E' : '#F7F3EC';
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', color);
      } catch (e) { /* storage blocked: keep the OS-driven colours */ }
    })();
  </script>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" focusable="false">
        <path d="M2 2l20 20"/>
        <path d="M8.5 16.4a5 5 0 0 1 7 0"/>
        <path d="M5 12.9a10 10 0 0 1 5.2-2.7"/>
        <path d="M19 12.9a10 10 0 0 0-2-1.5"/>
        <path d="M2 8.8a15 15 0 0 1 4.2-2.6"/>
        <path d="M22 8.8a15 15 0 0 0-11.3-3.7"/>
        <path d="M12 20h.01"/>
      </svg>
    </div>

    <h1>ไม่มีการเชื่อมต่ออินเทอร์เน็ต</h1>
    <p>Kafé OS ต้องต่ออินเทอร์เน็ตจึงจะขายและบันทึกข้อมูลได้ ลองตรวจ Wi‑Fi หรือเราเตอร์ของร้าน แล้วกดลองใหม่</p>

    <p class="en" lang="en">
      <strong>You are offline</strong>
      Kafé OS needs an internet connection to take orders and save data. Check the shop Wi‑Fi or router, then try again.
    </p>

    <button type="button" id="retry">ลองใหม่ · <span lang="en">Try again</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      var button = document.getElementById('retry');
      var status = document.getElementById('status');

      function reload() {
        button.disabled = true;
        // One node, inserted once, so the live region announces a single message;
        // the English half is tagged so a Thai screen-reader voice switches for it.
        var message = document.createElement('span');
        message.appendChild(document.createTextNode('กำลังเชื่อมต่อ… · '));
        var english = document.createElement('span');
        english.lang = 'en';
        english.textContent = 'Reconnecting…';
        message.appendChild(english);
        status.textContent = '';
        status.appendChild(message);
        // Back to the app. If the network is still down the service worker
        // serves this page again, so the button simply re-enables.
        window.location.replace('/');
      }

      button.addEventListener('click', reload);
      // Come back on our own as soon as the device reports a connection.
      window.addEventListener('online', reload);
    })();
  </script>
</body>
</html>
